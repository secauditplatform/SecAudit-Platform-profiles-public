        severity: "HIGH"
      RULE4:
        id: "RULE4"
        summary: "Auditing is configured for the Docker daemon"
        severity: "MEDIUM"
      RULE5:
        id: "RULE5"
        summary: "Auditing is configured for Docker files and directories — /run/containerd"
        severity: "MEDIUM"
      RULE6:
        id: "RULE6"
        summary: "Auditing is configured for Docker files and directories — /var/lib/docker"
        severity: "MEDIUM"
      RULE7:
