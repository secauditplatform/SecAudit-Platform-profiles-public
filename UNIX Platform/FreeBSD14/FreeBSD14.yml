  pre_tasks:
    - name: Read FreeBSD identity without Python
      ansible.builtin.raw: |
        uname -r
        uname -K
        uname -m
      register: freebsd_14_uname
      changed_when: false

    - name: Set minimal FreeBSD facts without Python
      ansible.builtin.set_fact:
        freebsd_14_os_family: FreeBSD
        freebsd_14_distribution: FreeBSD
        freebsd_14_distribution_version: "{{ (freebsd_14_uname.stdout_lines[0] | default('14.0')).split('-')[0] }}"
        freebsd_14_distribution_major_version: "{{ ((freebsd_14_uname.stdout_lines[0] | default('14.0')).split('-')[0]).split('.')[0] }}"
        freebsd_14_kernel: "{{ freebsd_14_uname.stdout_lines[0] | default('14.0-RELEASE') }}"
  tasks:
    - name: Confirm supported FreeBSD OS family
      ansible.builtin.assert:
        that:
          - freebsd_14_os_family == 'FreeBSD'
        fail_msg: >-
          Host OS family is {{ freebsd_14_os_family }}, expected FreeBSD
          for FreeBSD 14 CRE checks.
        success_msg: "OS family {{ freebsd_14_os_family }} is supported"
      when: freebsd_14_strict_os_check | bool

    - name: "Warn when distribution is not FreeBSD 14"
      ansible.builtin.debug:
        msg: >-
          Profile targets FreeBSD 14; detected
          {{ freebsd_14_distribution }} {{ freebsd_14_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        freebsd_14_distribution != 'FreeBSD'
        or (freebsd_14_distribution_major_version | string) != '14'

    - name: "Run FreeBSD 14 CRE audit script (same checks as profile package)"
      ansible.builtin.script: FreeBSD14.sh
      args:
        executable: /bin/sh
      register: freebsd_14_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        freebsd_14_lines: >-
          {%- set rows = [] -%}
          {%- for line in freebsd_14_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A|SKIP|ERROR)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = freebsd_14_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        freebsd_14_pass_count: >-
          {{ freebsd_14_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        freebsd_14_fail_count: >-
          {{ freebsd_14_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        freebsd_14_total_count: "{{ freebsd_14_lines | default([]) | length }}"

    - name: "FreeBSD 14 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ freebsd_14_distribution }} {{ freebsd_14_distribution_version }}"
          kernel: "{{ freebsd_14_kernel }}"
          profile: FreeBSD14_CRE
          script: FreeBSD14.sh
          total: "{{ freebsd_14_total_count }}"
          passed: "{{ freebsd_14_pass_count }}"
          failed: "{{ freebsd_14_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ freebsd_14_lines | default([]) }}"
          script_rc: "{{ freebsd_14_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (freebsd_14_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from FreeBSD14.sh output.
          rc={{ freebsd_14_audit_raw.rc | default('n/a') }}
          stderr={{ freebsd_14_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (freebsd_14_fail_count | int) == 0
        fail_msg: >-
          FreeBSD 14 CRE audit found {{ freebsd_14_fail_count }} failed check(s)
          out of {{ freebsd_14_total_count }}.
        success_msg: >-
          FreeBSD 14 CRE audit passed {{ freebsd_14_pass_count }}/{{ freebsd_14_total_count }} checks.
      when: freebsd_14_fail_on_noncompliance | bool
