  tasks:
    - name: Confirm supported RedHat-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected RedHat-family
          for AKS Optimized Azure Linux 2 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: azure_linux_strict_os_check | bool

    - name: "Warn when distribution is not AKS Optimized Azure 2"
      ansible.builtin.debug:
        msg: >-
          Profile targets AKS Optimized Azure Linux 2; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'AKS Optimized Azure'
        or (ansible_distribution_major_version | string) != '2'

    - name: "Run AKS Optimized Azure Linux 2 CRE audit script (same checks as profile package)"
      ansible.builtin.script: Azure_linux.sh
      args:
        executable: /bin/bash
      register: azure_linux_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        azure_linux_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in azure_linux_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = azure_linux_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        azure_linux_pass_count: >-
          {{ azure_linux_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        azure_linux_fail_count: >-
          {{ azure_linux_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        azure_linux_total_count: "{{ azure_linux_compliance_lines | default([]) | length }}"

    - name: "AKS Optimized Azure Linux 2 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Azure_Linux_CRE_NUP(1.3.0)
          script: Azure_linux.sh
          total: "{{ azure_linux_total_count }}"
          passed: "{{ azure_linux_pass_count }}"
          failed: "{{ azure_linux_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ azure_linux_compliance_lines | default([]) }}"
          script_rc: "{{ azure_linux_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (azure_linux_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Azure_linux.sh output.
          rc={{ azure_linux_audit_raw.rc | default('n/a') }}
          stderr={{ azure_linux_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (azure_linux_fail_count | int) == 0
        fail_msg: >-
          AKS Optimized Azure Linux 2 CRE audit found {{ azure_linux_fail_count }} failed check(s)
          out of {{ azure_linux_total_count }}.
        success_msg: >-
          AKS Optimized Azure Linux 2 CRE audit passed {{ azure_linux_pass_count }}/{{ azure_linux_total_count }} checks.
      when: azure_linux_fail_on_noncompliance | bool

