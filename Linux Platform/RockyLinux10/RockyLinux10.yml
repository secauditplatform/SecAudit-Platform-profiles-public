  tasks:
    - name: Confirm supported RedHat distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected RedHat-family
          for Rocky Linux 10 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: rocky10_strict_os_check | bool

    - name: "Warn when distribution is not Rocky Linux 10"
      ansible.builtin.debug:
        msg: >-
          Profile targets Rocky Linux 10; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'Rocky'
        or (ansible_distribution_major_version | string) != '10'

    - name: "Run Rocky Linux 10 CRE audit script (same checks as profile package)"
      ansible.builtin.script: RockyLinux10.sh
      args:
        executable: /bin/bash
      register: rocky10_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        rocky10_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in rocky10_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = rocky10_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        rocky10_pass_count: >-
          {{ rocky10_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        rocky10_fail_count: >-
          {{ rocky10_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        rocky10_total_count: "{{ rocky10_compliance_lines | default([]) | length }}"

    - name: "Rocky Linux 10 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Rocky Linux 10
          script: RockyLinux10.sh
          total: "{{ rocky10_total_count }}"
          passed: "{{ rocky10_pass_count }}"
          failed: "{{ rocky10_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ rocky10_compliance_lines | default([]) }}"
          script_rc: "{{ rocky10_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (rocky10_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from RockyLinux10.sh output.
          rc={{ rocky10_audit_raw.rc | default('n/a') }}
          stderr={{ rocky10_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (rocky10_fail_count | int) == 0
        fail_msg: >-
          Rocky Linux 10 CRE audit found {{ rocky10_fail_count }} failed check(s)
          out of {{ rocky10_total_count }}.
        success_msg: >-
          Rocky Linux 10 CRE audit passed {{ rocky10_pass_count }}/{{ rocky10_total_count }} checks.
      when: rocky10_fail_on_noncompliance | bool

