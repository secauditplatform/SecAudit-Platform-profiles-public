        summary: "Only the root account has UID 0 in /etc/passwd is configured"
        severity: "HIGH"
      RULE164:
        id: "RULE164"
        summary: "All GIDs specified in /etc/passwd exist in /etc/group is configured"
        severity: "MEDIUM"
      RULE165:
        id: "RULE165"
        summary: "No duplicate UIDs exist in /etc/passwd is configured"
        severity: "HIGH"
      RULE166:
        id: "RULE166"
        summary: "There are no duplicate GID values in /etc/group is configured"
        severity: "HIGH"
      RULE167:
        id: "RULE167"
        summary: "/etc/passwd contains no duplicate usernames is configured"
        severity: "HIGH"
      RULE168:
        id: "RULE168"
        summary: "No duplicate group names exist in /etc/group is configured"
        severity: "HIGH"

  tasks:
    - name: Confirm supported Debian-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Debian-family
          for Debian 12 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: debian12_strict_os_check | bool

    - name: "Warn when distribution is not Debian 12"
      ansible.builtin.debug:
        msg: >-
          Profile targets Debian 12; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'Debian'
        or (ansible_distribution_major_version | string) != '12'

    - name: "Run Debian 12 CRE audit script (same checks as profile package)"
      ansible.builtin.script: Debian12.sh
      args:
        executable: /bin/bash
      register: debian12_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        debian12_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in debian12_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|SKIP|ERROR|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'REVIEW' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = debian12_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        debian12_pass_count: >-
          {{ debian12_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        debian12_fail_count: >-
          {{ debian12_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        debian12_total_count: "{{ debian12_compliance_lines | default([]) | length }}"

    - name: "Debian 12 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Debian12
          script: Debian12.sh
          total: "{{ debian12_total_count }}"
          passed: "{{ debian12_pass_count }}"
          failed: "{{ debian12_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ debian12_compliance_lines | default([]) }}"
          script_rc: "{{ debian12_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (debian12_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Debian12.sh output.
          rc={{ debian12_audit_raw.rc | default('n/a') }}
          stderr={{ debian12_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (debian12_fail_count | int) == 0
        fail_msg: >-
          Debian 12 CRE audit found {{ debian12_fail_count }} failed check(s)
          out of {{ debian12_total_count }}.
        success_msg: >-
          Debian 12 CRE audit passed {{ debian12_pass_count }}/{{ debian12_total_count }} checks.
      when: debian12_fail_on_noncompliance | bool
