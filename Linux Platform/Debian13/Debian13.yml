  tasks:
    - name: Confirm supported Debian-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Debian-family
          for Debian 13 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: debian13_strict_os_check | bool

    - name: "Warn when distribution is not Debian 13"
      ansible.builtin.debug:
        msg: >-
          Profile targets Debian 13; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'Debian'
        or (ansible_distribution_major_version | string) != '13'

    - name: "Run Debian 13 CRE audit script (same checks as profile package)"
      ansible.builtin.script: Debian13.sh
      args:
        executable: /bin/bash
      register: debian13_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        debian13_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in debian13_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = debian13_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        debian13_pass_count: >-
          {{ debian13_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        debian13_fail_count: >-
          {{ debian13_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        debian13_total_count: "{{ debian13_compliance_lines | default([]) | length }}"

    - name: "Debian 13 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Debian_13_CRE_NUP(1.3.0)_AI
          script: Debian13.sh
          total: "{{ debian13_total_count }}"
          passed: "{{ debian13_pass_count }}"
          failed: "{{ debian13_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ debian13_compliance_lines | default([]) }}"
          script_rc: "{{ debian13_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (debian13_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Debian13.sh output.
          rc={{ debian13_audit_raw.rc | default('n/a') }}
          stderr={{ debian13_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (debian13_fail_count | int) == 0
        fail_msg: >-
          Debian 13 CRE audit found {{ debian13_fail_count }} failed check(s)
          out of {{ debian13_total_count }}.
        success_msg: >-
          Debian 13 CRE audit passed {{ debian13_pass_count }}/{{ debian13_total_count }} checks.
      when: debian13_fail_on_noncompliance | bool

