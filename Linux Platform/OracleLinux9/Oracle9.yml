  tasks:
    - name: Confirm supported RedHat-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected RedHat-family
          for OracleLinux 9 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: oracle9_strict_os_check | bool

    - name: "Warn when distribution is not OracleLinux 9"
      ansible.builtin.debug:
        msg: >-
          Profile targets OracleLinux 9; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'OracleLinux'
        or (ansible_distribution_major_version | string) != '9'

    - name: "Run OracleLinux 9 CRE audit script (same checks as profile package)"
      ansible.builtin.script: Oracle9.sh
      args:
        executable: /bin/bash
      register: oracle9_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        oracle9_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in oracle9_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|SKIP|ERROR|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'REVIEW' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = oracle9_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        oracle9_pass_count: >-
          {{ oracle9_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        oracle9_fail_count: >-
          {{ oracle9_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        oracle9_total_count: "{{ oracle9_compliance_lines | default([]) | length }}"

    - name: "OracleLinux 9 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: OracleLinux9
          script: Oracle9.sh
          total: "{{ oracle9_total_count }}"
          passed: "{{ oracle9_pass_count }}"
          failed: "{{ oracle9_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ oracle9_compliance_lines | default([]) }}"
          script_rc: "{{ oracle9_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (oracle9_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Oracle9.sh output.
          rc={{ oracle9_audit_raw.rc | default('n/a') }}
          stderr={{ oracle9_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (oracle9_fail_count | int) == 0
        fail_msg: >-
          OracleLinux 9 CRE audit found {{ oracle9_fail_count }} failed check(s)
          out of {{ oracle9_total_count }}.
        success_msg: >-
          OracleLinux 9 CRE audit passed {{ oracle9_pass_count }}/{{ oracle9_total_count }} checks.
      when: oracle9_fail_on_noncompliance | bool
