  tasks:
    - name: Confirm supported SUSE-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Suse'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Suse-family
          for OpenSUSE 15 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: opensuse15_strict_os_check | bool

    - name: "Warn when distribution is not OpenSUSE 15"
      ansible.builtin.debug:
        msg: >-
          Profile targets OpenSUSE 15; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ('openSUSE Leap' not in (ansible_distribution | string))
        or (ansible_distribution_major_version | string) != '15'

    - name: "Run OpenSUSE 15 CRE audit script (same checks as profile package)"
      ansible.builtin.script: OpenSUSE15.sh
      args:
        executable: /bin/bash
      register: opensuse15_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        opensuse15_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in opensuse15_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|SKIP|ERROR|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'REVIEW' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = opensuse15_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        opensuse15_pass_count: >-
          {{ opensuse15_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        opensuse15_fail_count: >-
          {{ opensuse15_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        opensuse15_total_count: "{{ opensuse15_compliance_lines | default([]) | length }}"

    - name: "OpenSUSE 15 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: OpenSUSE15
          script: OpenSUSE15.sh
          total: "{{ opensuse15_total_count }}"
          passed: "{{ opensuse15_pass_count }}"
          failed: "{{ opensuse15_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ opensuse15_compliance_lines | default([]) }}"
          script_rc: "{{ opensuse15_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (opensuse15_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from OpenSUSE15.sh output.
          rc={{ opensuse15_audit_raw.rc | default('n/a') }}
          stderr={{ opensuse15_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (opensuse15_fail_count | int) == 0
        fail_msg: >-
          OpenSUSE 15 CRE audit found {{ opensuse15_fail_count }} failed check(s)
          out of {{ opensuse15_total_count }}.
        success_msg: >-
          OpenSUSE 15 CRE audit passed {{ opensuse15_pass_count }}/{{ opensuse15_total_count }} checks.
      when: opensuse15_fail_on_noncompliance | bool
