        severity: "LOW"

  tasks:
    - name: Confirm supported RedHat-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'RedHat'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected RedHat-family
          for RHEL 7 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: rhel7_strict_os_check | bool

    - name: "Warn when distribution is not RHEL 7"
      ansible.builtin.debug:
        msg: >-
          Profile targets RHEL 7; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'RedHat'
        or (ansible_distribution_major_version | string) != '7'

    - name: "Run RHEL 7 CRE audit script (same checks as profile package)"
      ansible.builtin.script: RHEL7.sh
      args:
        executable: /bin/bash
      register: rhel7_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        rhel7_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in rhel7_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|SKIP|ERROR|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'REVIEW' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = rhel7_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        rhel7_pass_count: >-
          {{ rhel7_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        rhel7_fail_count: >-
          {{ rhel7_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        rhel7_total_count: "{{ rhel7_compliance_lines | default([]) | length }}"

    - name: "RHEL 7 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: RHEL7
          script: RHEL7.sh
          total: "{{ rhel7_total_count }}"
          passed: "{{ rhel7_pass_count }}"
          failed: "{{ rhel7_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ rhel7_compliance_lines | default([]) }}"
          script_rc: "{{ rhel7_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (rhel7_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from RHEL7.sh output.
          rc={{ rhel7_audit_raw.rc | default('n/a') }}
          stderr={{ rhel7_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (rhel7_fail_count | int) == 0
        fail_msg: >-
          RHEL 7 CRE audit found {{ rhel7_fail_count }} failed check(s)
          out of {{ rhel7_total_count }}.
        success_msg: >-
          RHEL 7 CRE audit passed {{ rhel7_pass_count }}/{{ rhel7_total_count }} checks.
      when: rhel7_fail_on_noncompliance | bool
