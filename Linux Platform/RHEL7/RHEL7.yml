      RULE217:
        id: "RULE217"
        summary: "SSH PAM is enabled"
        severity: "MEDIUM"
      RULE223:
        id: "RULE223"
        summary: "System accounts are secured is configured"
        severity: "MEDIUM"
      RULE226:
        id: "RULE226"
        summary: "Access to the su command is restricted"
        severity: "MEDIUM"
      RULE227:
        id: "RULE227"
        summary: "Accounts in /etc/passwd use shadow passwords is configured"
        severity: "HIGH"
      RULE228:
        id: "RULE228"
        summary: "All groups in /etc/passwd exist in /etc/group is configured"
        severity: "MEDIUM"
      RULE229:
        id: "RULE229"
        summary: "The shadow group is empty is configured"
        severity: "HIGH"
      RULE230:
        id: "RULE230"
