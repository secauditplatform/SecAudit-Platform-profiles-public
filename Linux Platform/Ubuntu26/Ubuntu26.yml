  tasks:
    - name: Confirm supported Debian distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Debian-family
          for Ubuntu 26 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: ubuntu26_strict_os_check | bool

    - name: "Warn when distribution is not Ubuntu 26"
      ansible.builtin.debug:
        msg: >-
          Profile targets Ubuntu 26; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'Ubuntu'
        or (ansible_distribution_major_version | string) != '26'

    - name: "Run Ubuntu 26 CRE audit script (same checks as profile package)"
      ansible.builtin.script: Ubuntu26.sh
      args:
        executable: /bin/bash
      environment:
        SECAUDIT_RULES: "{{ SECAUDIT_RULES | default('', true) }}"
        SECAUDIT_REMEDIATE_RULES: "{{ SECAUDIT_REMEDIATE_RULES | default('', true) }}"
        SECAUDIT_VAR_SYSCTL_KRN_APPARMOR_RESTRICT_UNPRIVILEGED: "{{ SECAUDIT_VAR_SYSCTL_KRN_APPARMOR_RESTRICT_UNPRIVILEGED | default('1', true) }}"
        SECAUDIT_VAR_SYSCTL_IPV6_ALL_DISABLE_IPV6: "{{ SECAUDIT_VAR_SYSCTL_IPV6_ALL_DISABLE_IPV6 | default('1', true) }}"
        SECAUDIT_VAR_CLIENT_ALIVE_INTERVAL: "{{ SECAUDIT_VAR_CLIENT_ALIVE_INTERVAL | default('900', true) }}"
        SECAUDIT_VAR_PASS_MAX_DAYS: "{{ SECAUDIT_VAR_PASS_MAX_DAYS | default('365', true) }}"
        SECAUDIT_VAR_PASS_WARN_AGE: "{{ SECAUDIT_VAR_PASS_WARN_AGE | default('7', true) }}"
        SECAUDIT_VAR_INACTIVE_DAYS: "{{ SECAUDIT_VAR_INACTIVE_DAYS | default('30', true) }}"
        SECAUDIT_VAR_LOGIN_GRACE_TIME: "{{ SECAUDIT_VAR_LOGIN_GRACE_TIME | default('60', true) }}"
        SECAUDIT_VAR_MAX_AUTH_TRIES: "{{ SECAUDIT_VAR_MAX_AUTH_TRIES | default('4', true) }}"
        SECAUDIT_VAR_MAX_SESSIONS: "{{ SECAUDIT_VAR_MAX_SESSIONS | default('10', true) }}"
        SECAUDIT_VAR_PASS_MIN_DAYS: "{{ SECAUDIT_VAR_PASS_MIN_DAYS | default('1', true) }}"
        SECAUDIT_VAR_MODE_AUDIT_LOG_DIR: "{{ SECAUDIT_VAR_MODE_AUDIT_LOG_DIR | default('644', true) }}"
        SECAUDIT_VAR_MODE_AUDIT_LOG_DIR_755: "{{ SECAUDIT_VAR_MODE_AUDIT_LOG_DIR_755 | default('755', true) }}"
        SECAUDIT_VAR_MODE_AUDIT_LOG_DIR_640: "{{ SECAUDIT_VAR_MODE_AUDIT_LOG_DIR_640 | default('640', true) }}"
        SECAUDIT_VAR_MODE_GRUB_CFG: "{{ SECAUDIT_VAR_MODE_GRUB_CFG | default('600', true) }}"
        SECAUDIT_VAR_MODE_MOTD: "{{ SECAUDIT_VAR_MODE_MOTD | default('644', true) }}"
        SECAUDIT_VAR_MODE_ISSUE: "{{ SECAUDIT_VAR_MODE_ISSUE | default('644', true) }}"
        SECAUDIT_VAR_MODE_ISSUE_NET: "{{ SECAUDIT_VAR_MODE_ISSUE_NET | default('644', true) }}"
        SECAUDIT_VAR_MODE_CRONTAB: "{{ SECAUDIT_VAR_MODE_CRONTAB | default('600', true) }}"
        SECAUDIT_VAR_MODE_CRON_HOURLY: "{{ SECAUDIT_VAR_MODE_CRON_HOURLY | default('700', true) }}"
        SECAUDIT_VAR_MODE_CRON_DAILY: "{{ SECAUDIT_VAR_MODE_CRON_DAILY | default('700', true) }}"
        SECAUDIT_VAR_MODE_CRON_WEEKLY: "{{ SECAUDIT_VAR_MODE_CRON_WEEKLY | default('700', true) }}"
        SECAUDIT_VAR_MODE_CRON_MONTHLY: "{{ SECAUDIT_VAR_MODE_CRON_MONTHLY | default('700', true) }}"
        SECAUDIT_VAR_MODE_CRON_YEARLY: "{{ SECAUDIT_VAR_MODE_CRON_YEARLY | default('700', true) }}"
        SECAUDIT_VAR_MODE_AUDIT_LOG_DIR_700: "{{ SECAUDIT_VAR_MODE_AUDIT_LOG_DIR_700 | default('700', true) }}"
        SECAUDIT_VAR_MODE_CRON_ALLOW: "{{ SECAUDIT_VAR_MODE_CRON_ALLOW | default('640', true) }}"
        SECAUDIT_VAR_MODE_AT_ALLOW: "{{ SECAUDIT_VAR_MODE_AT_ALLOW | default('640', true) }}"
        SECAUDIT_VAR_MODE_SSHD_CONFIG: "{{ SECAUDIT_VAR_MODE_SSHD_CONFIG | default('600', true) }}"
        SECAUDIT_VAR_MODE_SSHD_CONFIG_700: "{{ SECAUDIT_VAR_MODE_SSHD_CONFIG_700 | default('700', true) }}"
        SECAUDIT_VAR_MODE_SSH_HOSTKEY_PUB: "{{ SECAUDIT_VAR_MODE_SSH_HOSTKEY_PUB | default('600', true) }}"
        SECAUDIT_VAR_MODE_SSH_HOSTKEY_PUB_644: "{{ SECAUDIT_VAR_MODE_SSH_HOSTKEY_PUB_644 | default('644', true) }}"
        SECAUDIT_VAR_MODE_PASSWD: "{{ SECAUDIT_VAR_MODE_PASSWD | default('644', true) }}"
        SECAUDIT_VAR_MODE_PASSWD_DASH: "{{ SECAUDIT_VAR_MODE_PASSWD_DASH | default('644', true) }}"
        SECAUDIT_VAR_MODE_GROUP: "{{ SECAUDIT_VAR_MODE_GROUP | default('644', true) }}"
        SECAUDIT_VAR_MODE_GROUP_DASH: "{{ SECAUDIT_VAR_MODE_GROUP_DASH | default('644', true) }}"
        SECAUDIT_VAR_MODE_SHADOW: "{{ SECAUDIT_VAR_MODE_SHADOW | default('640', true) }}"
        SECAUDIT_VAR_MODE_SHADOW_DASH: "{{ SECAUDIT_VAR_MODE_SHADOW_DASH | default('640', true) }}"
        SECAUDIT_VAR_MODE_GSHADOW: "{{ SECAUDIT_VAR_MODE_GSHADOW | default('640', true) }}"
        SECAUDIT_VAR_MODE_GSHADOW_DASH: "{{ SECAUDIT_VAR_MODE_GSHADOW_DASH | default('640', true) }}"
        SECAUDIT_VAR_MODE_SHELLS: "{{ SECAUDIT_VAR_MODE_SHELLS | default('644', true) }}"
        SECAUDIT_VAR_MODE_OPASSWD: "{{ SECAUDIT_VAR_MODE_OPASSWD | default('600', true) }}"
      register: ubuntu26_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        ubuntu26_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in ubuntu26_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = ubuntu26_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        ubuntu26_pass_count: >-
          {{ ubuntu26_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        ubuntu26_fail_count: >-
          {{ ubuntu26_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        ubuntu26_total_count: "{{ ubuntu26_compliance_lines | default([]) | length }}"

    - name: "Ubuntu 26 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Ubuntu 26
          script: Ubuntu26.sh
          total: "{{ ubuntu26_total_count }}"
          passed: "{{ ubuntu26_pass_count }}"
          failed: "{{ ubuntu26_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ ubuntu26_compliance_lines | default([]) }}"
          script_rc: "{{ ubuntu26_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (ubuntu26_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Ubuntu26.sh output.
          rc={{ ubuntu26_audit_raw.rc | default('n/a') }}
          stderr={{ ubuntu26_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (ubuntu26_fail_count | int) == 0
        fail_msg: >-
          Ubuntu 26 CRE audit found {{ ubuntu26_fail_count }} failed check(s)
          out of {{ ubuntu26_total_count }}.
        success_msg: >-
          Ubuntu 26 CRE audit passed {{ ubuntu26_pass_count }}/{{ ubuntu26_total_count }} checks.
      when: ubuntu26_fail_on_noncompliance | bool

