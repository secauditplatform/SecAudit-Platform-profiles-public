  tasks:
    - name: Confirm supported Debian-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Debian'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Debian-family
          for Debian 11 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: debian11_strict_os_check | bool

    - name: "Warn when distribution is not Debian 11"
      ansible.builtin.debug:
        msg: >-
          Profile targets Debian 11; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'Debian'
        or (ansible_distribution_major_version | string) != '11'

    - name: "Run Debian 11 CRE audit script (same checks as profile package)"
      ansible.builtin.script: Debian11.sh
      args:
        executable: /bin/bash
      register: debian11_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        debian11_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in debian11_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|SKIP|ERROR|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'REVIEW' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = debian11_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        debian11_pass_count: >-
          {{ debian11_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        debian11_fail_count: >-
          {{ debian11_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        debian11_total_count: "{{ debian11_compliance_lines | default([]) | length }}"

    - name: "Debian 11 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Debian11
          script: Debian11.sh
          total: "{{ debian11_total_count }}"
          passed: "{{ debian11_pass_count }}"
          failed: "{{ debian11_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ debian11_compliance_lines | default([]) }}"
          script_rc: "{{ debian11_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (debian11_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Debian11.sh output.
          rc={{ debian11_audit_raw.rc | default('n/a') }}
          stderr={{ debian11_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (debian11_fail_count | int) == 0
        fail_msg: >-
          Debian 11 CRE audit found {{ debian11_fail_count }} failed check(s)
          out of {{ debian11_total_count }}.
        success_msg: >-
          Debian 11 CRE audit passed {{ debian11_pass_count }}/{{ debian11_total_count }} checks.
      when: debian11_fail_on_noncompliance | bool
