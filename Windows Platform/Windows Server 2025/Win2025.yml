  tasks:
    - name: Confirm Windows OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Windows'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Windows
          for Microsoft Windows Server 2025 Standard CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: win2025_strict_os_check | bool

    - name: "Warn when Windows edition is not Microsoft Windows Server 2025 Standard 10"
      ansible.builtin.debug:
        msg: >-
          Profile targets Microsoft Windows Server 2025 Standard; detected
          {{ ansible_os_name | default(ansible_distribution) }}
          {{ ansible_os_version | default(ansible_distribution_version) }}.
          Continuing audit with the same CRE PowerShell checks.
      when: >-
        ('Microsoft Windows Server 2025 Standard' not in (ansible_os_name | default(ansible_distribution) | string))

    - name: Prepare remote SecAudit work directory
      ansible.windows.win_file:
        path: "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}"
        state: directory

    - name: Copy Windows Server 2025 audit script
      ansible.windows.win_copy:
        src: Win2025.ps1
        dest: "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}\\Win2025.ps1"

    - name: "Run Microsoft Windows Server 2025 Standard CRE audit script (same checks as profile package)"
      ansible.windows.win_shell: |
        & "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}\\Win2025.ps1"
      environment:
        SECAUDIT_RULES: "{{ SECAUDIT_RULES | default('', true) }}"
        SECAUDIT_REMEDIATE_RULES: "{{ SECAUDIT_REMEDIATE_RULES | default('', true) }}"
        SECAUDIT_VAR_MAXIMUMPASSWORDAGE: "{{ SECAUDIT_VAR_MAXIMUMPASSWORDAGE | default('1..30', true) }}"
        SECAUDIT_VAR_RULE063: "{{ SECAUDIT_VAR_MAXIMUMPASSWORDAGE | default('1..30', true) }}"
        SECAUDIT_VAR_INACTIVITYTIMEOUTSECS: "{{ SECAUDIT_VAR_INACTIVITYTIMEOUTSECS | default('1..900', true) }}"
        SECAUDIT_VAR_RULE068: "{{ SECAUDIT_VAR_INACTIVITYTIMEOUTSECS | default('1..900', true) }}"
        SECAUDIT_VAR_CACHEDLOGONSCOUNT: "{{ SECAUDIT_VAR_CACHEDLOGONSCOUNT | default('4', true) }}"
        SECAUDIT_VAR_RULE071: "{{ SECAUDIT_VAR_CACHEDLOGONSCOUNT | default('4', true) }}"
        SECAUDIT_VAR_PASSWORDEXPIRYWARNING: "{{ SECAUDIT_VAR_PASSWORDEXPIRYWARNING | default('5..14', true) }}"
        SECAUDIT_VAR_RULE072: "{{ SECAUDIT_VAR_PASSWORDEXPIRYWARNING | default('5..14', true) }}"
        SECAUDIT_VAR_SCREMOVEOPTION: "{{ SECAUDIT_VAR_SCREMOVEOPTION | default('1..2', true) }}"
        SECAUDIT_VAR_RULE073: "{{ SECAUDIT_VAR_SCREMOVEOPTION | default('1..2', true) }}"
        SECAUDIT_VAR_SMBSERVERNAMEHARDENINGLEVEL: "{{ SECAUDIT_VAR_SMBSERVERNAMEHARDENINGLEVEL | default('1', true) }}"
        SECAUDIT_VAR_RULE081: "{{ SECAUDIT_VAR_SMBSERVERNAMEHARDENINGLEVEL | default('1', true) }}"
        SECAUDIT_VAR_LDAPCLIENTINTEGRITY: "{{ SECAUDIT_VAR_LDAPCLIENTINTEGRITY | default('1', true) }}"
        SECAUDIT_VAR_RULE101: "{{ SECAUDIT_VAR_LDAPCLIENTINTEGRITY | default('1', true) }}"
        SECAUDIT_VAR_LOGFILESIZE: "{{ SECAUDIT_VAR_LOGFILESIZE | default('16384', true) }}"
