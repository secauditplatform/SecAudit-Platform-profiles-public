  tasks:
    - name: Confirm supported Suse-family distribution
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Suse'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Suse-family
          for OpenSUSE 16 CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: opensuse_16_strict_os_check | bool

    - name: "Warn when distribution is not OpenSUSE 16"
      ansible.builtin.debug:
        msg: >-
          Profile targets OpenSUSE 16; detected
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Continuing audit with the same CRE script checks.
      when: >-
        ansible_distribution != 'OpenSUSE'
        or (ansible_distribution_major_version | string) != '16'

    - name: "Run OpenSUSE 16 CRE audit script (same checks as profile package)"
      ansible.builtin.script: OpenSUSE16.sh
      args:
        executable: /bin/bash
      register: opensuse_16_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        opensuse_16_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in opensuse_16_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = opensuse_16_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        opensuse_16_pass_count: >-
          {{ opensuse_16_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        opensuse_16_fail_count: >-
          {{ opensuse_16_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        opensuse_16_total_count: "{{ opensuse_16_compliance_lines | default([]) | length }}"

    - name: "OpenSUSE 16 CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: OpenSUSE_CRE_16_NUP(1.3.0)_AI
          script: OpenSUSE16.sh
          total: "{{ opensuse_16_total_count }}"
          passed: "{{ opensuse_16_pass_count }}"
          failed: "{{ opensuse_16_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ opensuse_16_compliance_lines | default([]) }}"
          script_rc: "{{ opensuse_16_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (opensuse_16_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from OpenSUSE16.sh output.
          rc={{ opensuse_16_audit_raw.rc | default('n/a') }}
          stderr={{ opensuse_16_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (opensuse_16_fail_count | int) == 0
        fail_msg: >-
          OpenSUSE 16 CRE audit found {{ opensuse_16_fail_count }} failed check(s)
          out of {{ opensuse_16_total_count }}.
        success_msg: >-
          OpenSUSE 16 CRE audit passed {{ opensuse_16_pass_count }}/{{ opensuse_16_total_count }} checks.
      when: opensuse_16_fail_on_noncompliance | bool

