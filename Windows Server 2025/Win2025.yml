  tasks:
    - name: Confirm Windows OS family
      ansible.builtin.assert:
        that:
          - ansible_os_family == 'Windows'
        fail_msg: >-
          Host OS family is {{ ansible_os_family }}, expected Windows
          for Microsoft Windows Server 2025 Standard CRE checks.
        success_msg: "OS family {{ ansible_os_family }} is supported"
      when: win2025_strict_os_check | bool

    - name: "Warn when Windows edition is not Microsoft Windows Server 2025 Standard 10"
      ansible.builtin.debug:
        msg: >-
          Profile targets Microsoft Windows Server 2025 Standard; detected
          {{ ansible_os_name | default(ansible_distribution) }}
          {{ ansible_os_version | default(ansible_distribution_version) }}.
          Continuing audit with the same CRE PowerShell checks.
      when: >-
        ('Microsoft Windows Server 2025 Standard' not in (ansible_os_name | default(ansible_distribution) | string))

    - name: Prepare remote SecAudit work directory
      ansible.windows.win_file:
        path: "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}"
        state: directory

    - name: Copy Windows Server 2025 audit script
      ansible.windows.win_copy:
        src: Win2025.ps1
        dest: "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}\\Win2025.ps1"

    - name: Copy Windows Server 2025 rules payload
      ansible.windows.win_copy:
        src: Win2025.rules.json
        dest: "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}\\Win2025.rules.json"

    - name: "Run Microsoft Windows Server 2025 Standard CRE audit script (same checks as profile package)"
      ansible.windows.win_shell: |
        & "{{ win2025_remote_dir | default('C:\\Windows\\Temp\\secaudit_win2025') }}\\Win2025.ps1"
      register: win2025_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        win2025_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in win2025_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|N/?A|SKIP|ERROR)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = win2025_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        win2025_pass_count: >-
          {{ win2025_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        win2025_fail_count: >-
          {{ win2025_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        win2025_total_count: "{{ win2025_compliance_lines | default([]) | length }}"

    - name: "Microsoft Windows Server 2025 Standard CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_os_name | default(ansible_distribution) }} {{ ansible_os_version | default(ansible_distribution_version) }}"
          kernel: "{{ ansible_kernel | default('') }}"
          profile: Microsoft Windows Server 2025
          script: Win2025.ps1
          total: "{{ win2025_total_count }}"
          passed: "{{ win2025_pass_count }}"
          failed: "{{ win2025_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ win2025_compliance_lines | default([]) }}"
          script_rc: "{{ win2025_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (win2025_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Win2025.ps1 output.
          rc={{ win2025_audit_raw.rc | default('n/a') }}
          stderr={{ win2025_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (win2025_fail_count | int) == 0
        fail_msg: >-
          Microsoft Windows Server 2025 Standard CRE audit found {{ win2025_fail_count }} failed check(s)
          out of {{ win2025_total_count }}.
        success_msg: >-
          Microsoft Windows Server 2025 Standard CRE audit passed {{ win2025_pass_count }}/{{ win2025_total_count }} checks.
      when: win2025_fail_on_noncompliance | bool

