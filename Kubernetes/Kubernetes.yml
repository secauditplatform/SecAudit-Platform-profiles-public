        severity: "HIGH"

  tasks:
    - name: "Run Kubernetes CRE audit script (same checks as profile package)"
      ansible.builtin.script: Kubernetes.sh
      args:
        executable: /bin/bash
      register: kubernetes_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        kubernetes_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in kubernetes_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A|SKIP|ERROR)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = kubernetes_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        kubernetes_pass_count: >-
          {{ kubernetes_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        kubernetes_fail_count: >-
          {{ kubernetes_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        kubernetes_total_count: "{{ kubernetes_compliance_lines | default([]) | length }}"

    - name: "Kubernetes CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: Kubernetes_CRE_NUP(1.3.0)_AI
          script: Kubernetes.sh
          total: "{{ kubernetes_total_count }}"
          passed: "{{ kubernetes_pass_count }}"
          failed: "{{ kubernetes_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ kubernetes_compliance_lines | default([]) }}"
          script_rc: "{{ kubernetes_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (kubernetes_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from Kubernetes.sh output.
          rc={{ kubernetes_audit_raw.rc | default('n/a') }}
          stderr={{ kubernetes_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (kubernetes_fail_count | int) == 0
        fail_msg: >-
          Kubernetes CRE audit found {{ kubernetes_fail_count }} failed check(s)
          out of {{ kubernetes_total_count }}.
        success_msg: >-
          Kubernetes CRE audit passed {{ kubernetes_pass_count }}/{{ kubernetes_total_count }} checks.
      when: kubernetes_fail_on_noncompliance | bool

