        id: "RULE71"
        summary: "Log_statement is not set to none"
        severity: "MEDIUM"
      RULE72:
        id: "RULE72"
        summary: "Backslash_quote is set securely"User\" runtime environment parameters are configured"
        severity: "MEDIUM"
      RULE73:
        id: "RULE73"
        summary: "Default_transaction_isolation is set correctly"User\" runtime environment parameters are configured"
        severity: "MEDIUM"
      RULE74:
        id: "RULE74"
        summary: "Idle_in_transaction_session_timeout is configured"User\" runtime environment parameters are configured"
        severity: "MEDIUM"
      RULE75:
        id: "RULE75"
        summary: "Password_encryption is set correctly"User\" runtime environment parameters are configured"
        severity: "MEDIUM"
      RULE76:
        id: "RULE76"
        summary: "Tcp_keepalives_idle is configured"User\" runtime environment parameters are configured"
        severity: "MEDIUM"

  tasks:
    - name: "Run PostgreSQL CRE audit script (same checks as profile package)"
      ansible.builtin.script: PSQL.sh
      args:
        executable: /bin/bash
      register: psql_audit_raw
      changed_when: false
      failed_when: false

    - name: Parse RULE results into STATUS|id|summary|detail lines
      ansible.builtin.set_fact:
        psql_compliance_lines: >-
          {%- set rows = [] -%}
          {%- for line in psql_audit_raw.stdout_lines | default([]) -%}
          {%- set matched = line | regex_findall('^(RULE\\d+)\\s*=\\s*(PASS|FAIL|REVIEW|N/?A|SKIP|ERROR)\\s*:?\\s*(.*)$') -%}
          {%- if matched | length > 0 -%}
          {%- set rule_key = matched[0][0] | regex_replace('^RULE0*(\\d+)$', 'RULE\\1') -%}
          {%- set status = matched[0][1] | upper | regex_replace('/','') -%}
          {%- if status == 'NA' -%}{%- set status = 'SKIP' -%}{%- endif -%}
          {%- set detail = matched[0][2] -%}
          {%- set meta = psql_rule_meta[rule_key] | default({}) -%}
          {%- set row = status ~ '|' ~ (meta.id | default(rule_key)) ~ '|' ~ (meta.summary | default(rule_key)) ~ '|' ~ detail -%}
          {%- set _ = rows.append(row) -%}
          {%- endif -%}
          {%- endfor -%}
          {{ rows }}

    - name: Count PASS and FAIL results
      ansible.builtin.set_fact:
        psql_pass_count: >-
          {{ psql_compliance_lines | default([])
             | select('match', '^PASS\|') | list | length }}
        psql_fail_count: >-
          {{ psql_compliance_lines | default([])
             | select('match', '^FAIL\|') | list | length }}
        psql_total_count: "{{ psql_compliance_lines | default([]) | length }}"

    - name: "PostgreSQL CRE compliance summary"
      ansible.builtin.debug:
        msg:
          target: "{{ inventory_hostname }}"
          os: "{{ ansible_distribution }} {{ ansible_distribution_version }}"
          kernel: "{{ ansible_kernel }}"
          profile: PostgreSQL_CRE_NUP(1.3.0)_AI
          script: PSQL.sh
          total: "{{ psql_total_count }}"
          passed: "{{ psql_pass_count }}"
          failed: "{{ psql_fail_count }}"
          format: STATUS|rule_id|summary|detail
          checks: "{{ psql_compliance_lines | default([]) }}"
          script_rc: "{{ psql_audit_raw.rc | default('n/a') }}"

    - name: Ensure audit script produced parseable RULE results
      ansible.builtin.assert:
        that:
          - (psql_total_count | int) > 0
        fail_msg: >-
          No RULE*= PASS/FAIL lines parsed from PSQL.sh output.
          rc={{ psql_audit_raw.rc | default('n/a') }}
          stderr={{ psql_audit_raw.stderr | default('') }}

    - name: Fail when non-compliant checks exist
      ansible.builtin.assert:
        that:
          - (psql_fail_count | int) == 0
        fail_msg: >-
          PostgreSQL CRE audit found {{ psql_fail_count }} failed check(s)
          out of {{ psql_total_count }}.
        success_msg: >-
          PostgreSQL CRE audit passed {{ psql_pass_count }}/{{ psql_total_count }} checks.
      when: psql_fail_on_noncompliance | bool

