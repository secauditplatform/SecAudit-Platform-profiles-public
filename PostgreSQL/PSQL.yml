        summary: "The PostgreSQL port is explicitly configured"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE47:
        id: "RULE47"
        summary: "SSL is enabled"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE48:
        id: "RULE48"
        summary: "Ssl_ca_file is configured"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE49:
        id: "RULE49"
        summary: "Ssl_cert_file is configured"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE50:
        id: "RULE50"
        summary: "Ssl_ciphers is configured securely"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE51:
        id: "RULE51"
        summary: "Ssl_crl_file is configured when certificate revocation is required"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE52:
        id: "RULE52"
        summary: "Ssl_ecdh_curve is configured"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE53:
        id: "RULE53"
        summary: "Ssl_key_file is configured"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE54:
        id: "RULE54"
        summary: "Ssl_prefer_server_ciphers is enabled"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE55:
        id: "RULE55"
        summary: "Unix_socket_group is configured"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE56:
        id: "RULE56"
        summary: "Unix_socket_permissions are restrictive"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE57:
