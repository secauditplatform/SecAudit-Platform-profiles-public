        summary: "Event_source is set appropriately"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE44:
        id: "RULE44"
        summary: "Listen_addresses is not set to a wildcard"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE45:
        id: "RULE45"
        summary: "Logging_collector is enabled for the postmaster"Postmaster\" runtime parameters are configured"
        severity: "MEDIUM"
      RULE46:
