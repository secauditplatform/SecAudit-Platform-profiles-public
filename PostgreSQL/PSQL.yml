        severity: "MEDIUM"
      RULE69:
        id: "RULE69"
        summary: "Log_error_verbosity is configured"
        severity: "MEDIUM"
      RULE70:
        id: "RULE70"
        summary: "Log_min_messages is configured"
        severity: "MEDIUM"
